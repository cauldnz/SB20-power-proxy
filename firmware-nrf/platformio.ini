; firmware-nrf — the Seeed XIAO nRF52840 Sense build: BLE(/ANT) power-meter bridge with
; correction, BLE-controlled IMU capture, and a Web Bluetooth data surface (no WiFi here).
;
; Core: the Adafruit-fork variant (xiaoblesense_adafruit) = Bluefruit BLE API (concurrent
; central+peripheral, like the ESP32 builds' dual role) + FreeRTOS + the Sense's LSM6DS3TR-C.
; Platform: maxgerhardt's nordicnrf52 fork — stock PlatformIO has no XIAO nRF52840 board defs.
;
; ANT: needs the licensed S340 SoftDevice from thisisant.com (NOT redistributable) — see
; vendor/softdevice/README.md. Until it lands, everything ships BLE-first behind a radio seam.
;
; Flash: the XIAO uses the Adafruit UF2 bootloader — PlatformIO uploads over the CDC port
; (adafruit-nrfutil, auto 1200bps touch). Double-tap RST for the UF2 drive if it ever wedges.

[env:xiao-sense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52#develop  ; xiao boards live on develop
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
; Reuse the ESP32 firmware's PURE proxy core (Cps codec + Correction) by reference — one codec,
; twice deployed, exactly like code/'s Python twin. Only std-header files are included from it.
lib_extra_dirs = ../firmware/lib
lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3
