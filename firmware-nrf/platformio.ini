; firmware-nrf — the Seeed XIAO nRF52840 Sense build: BLE(/ANT) power-meter bridge with
; correction, BLE-controlled IMU capture, and a Web Bluetooth data surface (no WiFi here).
;
; Core: the Adafruit-fork variant (xiaoblesense_adafruit) = Bluefruit BLE API (concurrent
; central+peripheral, like the ESP32 builds' dual role) + FreeRTOS + the Sense's LSM6DS3TR-C.
; Platform: maxgerhardt's nordicnrf52 fork — stock PlatformIO has no XIAO nRF52840 board defs.
;
; ANT: needs the licensed S340 SoftDevice from thisisant.com (NOT redistributable) — see
; vendor/softdevice/README.md. Until it lands, everything ships BLE-first behind a radio seam.
;
; Flash: the XIAO uses the Adafruit UF2 bootloader — PlatformIO uploads over the CDC port
; (adafruit-nrfutil, auto 1200bps touch). Double-tap RST for the UF2 drive if it ever wedges.

; Host tests for the PURE wire-format core (lib/bridge: Proto.h + ImuCapture.h) — no board, no
; SoftDevice, runs in CI. `pio test -e native`. These headers are the byte-for-byte authority the
; web app (JS) and Connect IQ (Monkey C) mirror; the golden vectors here catch drift in any of them.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>          ; src/ needs Arduino/Bluefruit; the test provides main() on host
; Compile the shared pure headers under the SAME standard the board does. The nordicnrf52 platform
; hard-codes -std=gnu++11 (platform-nordicnrf52/builder/frameworks/adafruit.py), while the host
; compiler defaults to gnu++17 — so C++14-only constructs (an aggregate with default member
; initialisers, e.g. `return {true, PeerRole::Trainer};`) passed `pio test -e native` and then
; failed the device build. Pinning the host to gnu++11 makes host-green imply device-compiles.
build_flags = -std=gnu++11

; Both external refs below are pinned to an immutable COMMIT, not a moving branch/HEAD. They used
; to be `#develop` and a bare repo URL, which means the toolchain and the IMU driver could change
; under a rebuild — CI, the bike laptop, and a future clone could each compile different code from
; the same commit of this repo, and a red build would be unattributable. The pinned SHAs are the
; exact ones this project has been building and flashing with (verified 2026-07-26):
;   platform-nordicnrf52  cac6fcf  = develop HEAD (last moved 2023-09-23)
;   Seeed_Arduino_LSM6DS3 e063c3a  = v2.0.7 (master DID move, 2026-07-14 — this pin matters)
; To take an upstream update: bump the SHA here deliberately, in its own PR, and let CI compile it.
[platform_pins]
nordicnrf52 = https://github.com/maxgerhardt/platform-nordicnrf52#cac6fcf943a41accd2aeb4f3659ae297a73f422e
lsm6ds3 = https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3#e063c3a544b8bb89238accddf24f0028bcd1ca20

[env:xiao-sense]
platform = ${platform_pins.nordicnrf52}  ; xiao boards live on develop
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
; Reuse the ESP32 firmware's PURE proxy core (Cps codec + Correction) by reference — one codec,
; twice deployed, exactly like code/'s Python twin. Only std-header files are included from it.
lib_extra_dirs = ../firmware/lib
lib_deps =
    ${platform_pins.lsm6ds3}

; ---- Generic Adafruit-Feather-family nRF52840 (the incoming PRIMARY target) ----
; Same Adafruit bootloader family as the XIAO, so UF2 + buttonless BLE DFU keep working. The board
; seam (src/board.h, -DBOARD_FEATHER) maps the RGB status LED → the single LED_BUILTIN; the IMU driver
; still links but fails safe at runtime (no onboard sensor → recording inert). Everything else — the
; whole Bridge GATT, correction, calibration, erg, OBC, ANT codec — is board-independent.
[env:feather-nrf52840]
platform = ${platform_pins.nordicnrf52}
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../firmware/lib
lib_deps =
    ${platform_pins.lsm6ds3}
build_flags = -DBOARD_FEATHER

; ---- S340 (concurrent ANT+BLE) build — LOCAL ONLY, CI never builds this ----
; The licensed S340 SoftDevice headers + hex are gitignored (vendor/softdevice/), so this env only
; compiles on a machine that has provisioned them (see vendor/softdevice/README.md, nrf-roadmap.md P3).
; It links the app above MBR(0x1000)+SD(0x30000) = 0x31000 (custom linker) and puts the S340 API headers
; FIRST on the include path so they win over the core's bundled S140 headers. The ANT master code
; (src/ant/, lib/bridge/AntMasterScheduler.h) is guarded `#if defined(S340) && __has_include(ant_network_key.h)`
; so it's inert in every other env. Flash is the brick-risk morning step (dongle-first, run-sheet R1) —
; this env's job tonight is to COMPILE+LINK, proving the S340 headers/linker/ANT code are coherent.
[env:xiao-sense-s340]
extends = env:xiao-sense
board_build.ldscript = ${PROJECT_DIR}/linker/nrf52840_s340_v6.ld
build_flags =
    -DS340
    -Ivendor/softdevice/ANT_s340_nrf52840_6.1.1/ANT_s340_nrf52840_6.1.1.API/include
    -Ivendor/softdevice/ANT_s340_nrf52840_6.1.1/ANT_s340_nrf52840_6.1.1.API/include/nrf52
    -Ivendor/softdevice
