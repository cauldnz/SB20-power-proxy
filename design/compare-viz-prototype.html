<!doctype html>
<!-- #10 compare deep-dive — the web app's Compare view (prototype; design/, remote-render recipe).
     Renders the DEVICE'S REAL wire payload: GET /compare (WebJson.h::renderCompareJson) — summary +
     tqBias (bias% per 5 N·m torque band) + grid (power×cadence bias, the heatmap) + pairs (for
     Bland-Altman). In web/index.html this is `const COMPARE = await (await fetch('/compare')).json()`;
     here the same JSON is injected at render time so the page is self-contained. No CDNs; design tokens. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meter Compare — deep dive</title>
<style>
  :root{ --bg:#0f1320; --card:#1a2030; --fg:#e8ecf4; --mut:#8b93a7; --line:#1c2334;
         --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:20px}
  h1{font-size:20px;margin:0 0 2px} .sub{color:var(--mut);margin:0 0 16px;font-size:13px}
  .cards{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card{background:var(--card);border-radius:12px;padding:10px 12px;flex:1;min-width:120px}
  .card .lbl{color:var(--mut);font-size:12px} .card .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .card .u{color:var(--mut);font-size:13px;font-weight:400}
  .verdict{font-size:15px;font-weight:600;margin:2px 0 16px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:660px){.grid{grid-template-columns:1.25fr 1fr}}
  .panel{background:var(--card);border-radius:12px;padding:12px}
  .panel h2{font-size:12px;color:var(--mut);font-weight:600;margin:0 0 8px;text-transform:uppercase;letter-spacing:.4px}
  canvas{display:block;max-width:100%}
  .cbar{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--mut);font-size:12px}
  .cbar .grad{height:9px;flex:1;border-radius:5px;background:linear-gradient(90deg,#3b82f6,#26304a 45%,#26304a 55%,#ef4444)}
  .note{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.5}
  .kbd{background:#0c1220;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Meter Compare — deep dive</h1>
  <p class="sub" id="sub">—</p>

  <div class="cards">
    <div class="card"><div class="lbl" id="aLbl" style="color:var(--accent)">A</div><div class="big" id="aW">—</div></div>
    <div class="card"><div class="lbl" id="bLbl">B</div><div class="big" id="bW">—</div></div>
    <div class="card"><div class="lbl">mean bias</div><div class="big" id="bias">—</div></div>
    <div class="card"><div class="lbl">ratio</div><div class="big" id="ratio">—</div></div>
  </div>
  <div class="verdict" id="verdict"></div>

  <div class="grid">
    <div class="panel">
      <h2>Error map — power × cadence</h2>
      <canvas id="heat" width="440" height="280"></canvas>
      <div class="cbar"><span>B low</span><div class="grad"></div><span>B high</span></div>
    </div>
    <div class="panel">
      <h2>Bias by torque (N·m)</h2>
      <canvas id="torq" width="300" height="280"></canvas>
    </div>
    <div class="panel" style="grid-column:1/-1">
      <h2>Bland–Altman — agreement vs magnitude</h2>
      <canvas id="ba" width="740" height="220"></canvas>
    </div>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
// In web/index.html: const COMPARE = await (await fetch('/compare')).json();
// Here the SAME payload (WebJson.h::renderCompareJson) is injected at render time:
const COMPARE = /*__COMPARE_JSON__*/ {"valid":false};

const CAP = 15;                                   // colour saturates at +/-15% bias
function biasColor(pct){
  const t = Math.max(-1, Math.min(1, pct / CAP));
  const dark=[0x26,0x30,0x4a], hot = t>=0 ? [0xef,0x44,0x44] : [0x3b,0x82,0xf6], a=Math.abs(t);
  return `rgb(${dark.map((d,i)=>Math.round(d+(hot[i]-d)*a)).join(',')})`;
}
const D = COMPARE;

if(!D.valid){ document.getElementById('sub').textContent='waiting for both meters…'; }
else {
  // ---- summary ----
  sub.innerHTML = `${D.aName} (A, reference) vs ${D.bName} (B) · live from <span class="kbd">GET /compare</span>`;
  aLbl.textContent = D.aName + ' (A)'; bLbl.textContent = D.bName + ' (B)';
  aW.innerHTML = D.aW + '<span class="u"> W</span>';
  bW.innerHTML = D.bW + '<span class="u"> W</span>';
  bias.textContent = (D.biasPct>=0?'+':'') + D.biasPct.toFixed(1) + '%';
  bias.style.color = biasColor(D.biasPct*3);
  ratio.textContent = '×' + D.ratio.toFixed(3);
  // is the error flat across torque, or does it ramp?
  const tq = D.tqBias.map((v,i)=>({v,i})).filter(o=>o.v!==null);
  const spread = tq.length>1 ? tq[tq.length-1].v - tq[0].v : 0;
  const ramp = Math.abs(spread) > 3;
  verdict.innerHTML = ramp
    ? `${D.bName} reads <span style="color:var(--bad)">${D.biasPct>=0?'+':''}${D.biasPct.toFixed(1)}%</span> on average — but <b>not uniformly</b>: bias climbs ~${spread.toFixed(0)} points across the torque range.`
    : `${D.bName} reads <span style="color:var(--bad)">${D.biasPct>=0?'+':''}${D.biasPct.toFixed(1)}%</span> — and it is <b>flat</b> across torque (a clean scale error).`;

  // ---- heatmap from D.grid (power rows × cadence cols) ----
  (function(){
    const g=D.grid, ctx=heat.getContext('2d'), PAD={l:38,b:26,t:6,r:6};
    const P=g.P, C=g.C, W=heat.width-PAD.l-PAD.r, H=heat.height-PAD.t-PAD.b, cw=W/C, ch=H/P;
    for(let pi=0;pi<P;pi++)for(let ci=0;ci<C;ci++){
      const v=g.bias[pi][ci], x=PAD.l+ci*cw, y=PAD.t+(P-1-pi)*ch;  // power increases upward
      ctx.fillStyle = (v===null) ? '#141a28' : biasColor(v);
      ctx.fillRect(x+1,y+1,cw-2,ch-2);
    }
    // iso-torque guide (28 N·m): p = 28 * cad * 0.10472
    const pLo=0, pHi=g.P*g.pW, cLo=g.cLo, cHi=g.cLo+g.C*g.cW;
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.setLineDash([4,3]); ctx.beginPath(); let first=true;
    for(let cad=cLo;cad<=cHi;cad+=2){ const p=28*cad*0.10472; if(p<pLo||p>pHi)continue;
      const x=PAD.l+((cad-cLo)/(cHi-cLo))*W, y=PAD.t+H-((p-pLo)/(pHi-pLo))*H;
      if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);}
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='10px sans-serif'; ctx.fillText('28 N·m',PAD.l+4,PAD.t+12);
    ctx.fillStyle='#8b93a7';
    ctx.fillText('cadence (rpm) →', PAD.l, heat.height-6);
    ctx.save(); ctx.translate(11,PAD.t+H/2); ctx.rotate(-Math.PI/2); ctx.fillText('power (W) →',0,0); ctx.restore();
    ctx.fillText(''+cLo, PAD.l, PAD.t+H+13); ctx.fillText(''+cHi, PAD.l+W-16, PAD.t+H+13);
    ctx.fillText(''+pHi, 16, PAD.t+8); ctx.fillText('0', 24, PAD.t+H);
  })();

  // ---- bias-by-torque bars from D.tqBias ----
  (function(){
    const ctx=torq.getContext('2d'), N=D.tqBias.length, PAD={l:30,b:22,t:8,r:8};
    const W=torq.width-PAD.l-PAD.r, H=torq.height-PAD.t-PAD.b, mid=PAD.t+H/2, bw=W/N;
    ctx.strokeStyle='#2a3142'; ctx.beginPath(); ctx.moveTo(PAD.l,mid); ctx.lineTo(PAD.l+W,mid); ctx.stroke();
    ctx.fillStyle='#8b93a7'; ctx.font='10px sans-serif';
    ctx.fillText('0%',6,mid+3); ctx.fillText('+15',4,PAD.t+8); ctx.fillText('-15',6,PAD.t+H);
    D.tqBias.forEach((v,i)=>{ if(v===null)return;
      const h=Math.max(-1,Math.min(1,v/CAP))*(H/2), x=PAD.l+i*bw;
      ctx.fillStyle=biasColor(v);
      if(h>=0)ctx.fillRect(x+2,mid-h,bw-4,h); else ctx.fillRect(x+2,mid,bw-4,-h);
    });
    ctx.fillStyle='#8b93a7'; ctx.fillText('torque (N·m) →',PAD.l,torq.height-5);
    ctx.fillText('0',PAD.l,PAD.t+H+12); ctx.fillText(''+(N*D.tqBandNm),PAD.l+W-14,PAD.t+H+12);
  })();

  // ---- Bland-Altman from D.pairs: x = mean(A,B), y = B-A, with bias + 1.96 SD limits ----
  (function(){
    const ctx=ba.getContext('2d'), pts=D.pairs.map(([a,b])=>({x:(a+b)/2, y:b-a}));
    if(!pts.length) return;
    const PAD={l:44,b:26,t:10,r:10}, W=ba.width-PAD.l-PAD.r, H=ba.height-PAD.t-PAD.b;
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const xLo=Math.min(...xs), xHi=Math.max(...xs);
    const mean=ys.reduce((s,v)=>s+v,0)/ys.length;
    const sd=Math.sqrt(ys.reduce((s,v)=>s+(v-mean)**2,0)/ys.length);
    const yLo=Math.min(...ys, mean-2*sd), yHi=Math.max(...ys, mean+2*sd);
    const X=v=>PAD.l+((v-xLo)/(xHi-xLo||1))*W, Y=v=>PAD.t+H-((v-yLo)/((yHi-yLo)||1))*H;
    // limits of agreement
    const line=(v,c,dash,label)=>{ ctx.strokeStyle=c; ctx.setLineDash(dash); ctx.beginPath();
      ctx.moveTo(PAD.l,Y(v)); ctx.lineTo(PAD.l+W,Y(v)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=c; ctx.font='10px sans-serif'; ctx.fillText(label,PAD.l+W-64,Y(v)-3); };
    line(mean+1.96*sd,'#8b93a7',[4,3],'+1.96 SD');
    line(mean-1.96*sd,'#8b93a7',[4,3],'−1.96 SD');
    for(const p of pts){ ctx.fillStyle='rgba(239,68,68,.55)'; ctx.beginPath();
      ctx.arc(X(p.x),Y(p.y),2.2,0,7); ctx.fill(); }
    line(mean,'#ef4444',[],'bias '+mean.toFixed(1)+' W');
    ctx.fillStyle='#8b93a7'; ctx.font='10px sans-serif';
    ctx.fillText('mean of A,B (W) →',PAD.l,ba.height-6);
    ctx.save(); ctx.translate(12,PAD.t+H/2); ctx.rotate(-Math.PI/2); ctx.fillText('B − A (W)',0,0); ctx.restore();
    ctx.fillText(Math.round(xLo)+'',PAD.l,PAD.t+H+13); ctx.fillText(Math.round(xHi)+'',PAD.l+W-20,PAD.t+H+13);
  })();

  note.innerHTML = `Rendered from the device's real <span class="kbd">GET /compare</span> payload `+
    `(<span class="kbd">renderCompareJson</span>: summary + <span class="kbd">tqBias</span> + `+
    `<span class="kbd">grid</span> + <span class="kbd">pairs</span>, ~1.8 KB). A flat error paints the map `+
    `one colour and the torque bars level; the gradient here — parallel to the 28 N·m iso-line — and the `+
    `rising bars are the signature of a <b>torque-dependent</b> error. Bland–Altman shows the same story as `+
    `magnitude-dependent spread (the classic method-comparison view).`;
}
</script>
</body>
</html>
