<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB20 — Pick your meter v2</title>
<style>
:root{--bg:#0f1320;--card:#1a2030;--fg:#e8ecf4;--mut:#8b93a7;--ok:#22c55e;--accent:#3b82f6;--line:#1c2334;--chip2:#2a3142}
*{box-sizing:border-box}
html,body{width:200px;overflow:hidden}
body{margin:0;background:#0a0c14;color:var(--fg);font-family:system-ui,-apple-system,sans-serif;padding:9px;display:flex;justify-content:center}
.dev{box-sizing:border-box;width:182px;margin:0 auto;padding:4px;background:#05070d;border:1px solid rgba(255,255,255,.1);border-radius:18px}
.scr{width:172px;height:320px;background:var(--bg);color:var(--fg);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:12px;border-bottom:1px solid var(--line)}
.bd{padding:9px 10px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.k{font-size:11px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row.sel{border-color:var(--accent)}
.nm{font-size:13px;font-weight:500}
.rr{display:flex;align-items:center;gap:8px}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:15px}
.bars i{width:3px;border-radius:1px}
.tag{font-size:10px;background:var(--chip2);color:var(--mut);padding:1px 6px;border-radius:6px}
.chk{color:var(--accent);font-size:16px}
.tg{width:34px;height:20px;border-radius:10px;background:var(--chip2);position:relative;display:inline-block}
.tg i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mut)}
.btn{flex:1;text-align:center;padding:10px 0;border-radius:9px;font-size:12px;font-weight:500}
.bgr{background:var(--card);color:var(--fg)}
.bp{background:var(--accent);color:#fff}
.nav{margin-top:auto;display:flex;border-top:1px solid var(--line)}
.nav span{flex:1;text-align:center;padding:8px 0;color:var(--mut);font-size:11px}
.nav span.on{color:var(--accent)}
</style>
</head>
<body>
<div class="dev"><div class="scr">
<div class="tb"><span style="font-weight:500">Pick your meter</span><span style="color:var(--ok);font-size:11px">scanning&hellip;</span></div>
<div class="bd">

<div class="row sel">
<div><div class="nm">ASSIOMA17039L</div><div class="k">pedals &middot; &minus;52 dBm</div></div>
<div class="rr">
<span class="bars"><i style="height:6px;background:var(--ok)"></i><i style="height:9px;background:var(--ok)"></i><i style="height:12px;background:var(--ok)"></i><i style="height:15px;background:var(--ok)"></i></span>
<span class="chk">&#10003;</span>
</div>
</div>

<div class="row">
<div><div class="nm">Stages 4963 <span class="tag">crank</span></div><div class="k">&minus;61 dBm</div></div>
<span class="bars"><i style="height:6px;background:var(--ok)"></i><i style="height:9px;background:var(--ok)"></i><i style="height:12px;background:var(--ok)"></i><i style="height:15px;background:var(--chip2)"></i></span>
</div>

<div class="row">
<div><div class="nm">ASSIOMA22428R</div><div class="k">pedals &middot; &minus;74 dBm</div></div>
<span class="bars"><i style="height:6px;background:var(--ok)"></i><i style="height:9px;background:var(--ok)"></i><i style="height:12px;background:var(--chip2)"></i><i style="height:15px;background:var(--chip2)"></i></span>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 2px;font-size:12px">
<span>Single-sided &times;2 <span class="k">(left-only)</span></span><span class="tg"><i></i></span>
</div>

<div style="display:flex;gap:8px;margin-top:auto">
<span class="btn bgr">&#8635; Rescan</span><span class="btn bp">Use</span>
</div>
</div>
<div class="nav"><span>Ride</span><span class="on">Setup</span><span>More</span></div>
</div></div>
</body>
</html>
