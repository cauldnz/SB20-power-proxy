[project]
name = "sb20proxy"
version = "0.0.1"
description = "ANT+ power-meter proxy for the Stages SB20 smart bike"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TBD" }]

dependencies = [
    "openant>=1.3.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]
ble = [
    # For the BLE-side fallback path / Phase 4 features. Not needed for
    # ANT+-only spoofing of the SB20.
    "bleak>=0.22",
    "pycycling>=0.4",
]
analysis = [
    # For ingesting captures into InfluxDB so they can be explored in Grafana
    # (or shared with Claude via the summary/diff scripts that work on JSONL).
    "influxdb-client>=1.40",
    # For 12_compare_fit.py — read a head unit's recorded FIT to validate the
    # broadcast -> radio -> Garmin -> FIT path.
    "fitparse>=1.2",
]

[project.scripts]
sb20proxy = "sb20proxy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# webapp.py embeds a self-contained HTML/CSS/JS dashboard as a string asset; its
# inline JavaScript legitimately runs past the Python line length.
"src/sb20proxy/ride/webapp.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
