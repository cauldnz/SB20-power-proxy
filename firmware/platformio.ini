; sb20proxy ESP32 firmware — a dual-role BLE proxy:
;   real power meter (BLE central) -> [correction] -> spoofed Stages crank (BLE peripheral) -> SB20
;
; Layout mirrors cauldnz/raedian-probe's firmware: the platform-agnostic core lives in
; lib/proxy/ and is host-unit-tested (no hardware); src/main.cpp + src/ble are the only
; Arduino/NimBLE files.
;
;   pio test -e native                       # host tests of the pure core (codec/correction/relay)
;   pio run  -e esp32c3-supermini -t upload  # real firmware on an ESP32-C3 Super Mini
;
; The owner's "ESP32 Super Mini" is an ESP32-C3; the WaveShare touch board is an ESP32-S3.

[platformio]
default_envs = esp32c3-supermini

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_ldf_mode = deep+

; ---- Host unit tests: the pure proxy core, no hardware ----
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>          ; src/ needs Arduino/NimBLE; the test provides main() on host

; ---- Real firmware: ESP32-C3 Super Mini ----
[env:esp32c3-supermini]
platform = espressif32@~6.7.0
board = esp32-c3-devkitm-1       ; the Super Mini is pin/flash compatible
framework = arduino
test_framework = unity
; The proxy mains are main.cpp; the FTMS test builds bring their OWN setup()/loop() in
; ftms_{server,client}_main.cpp (each with its own build_src_filter below). Exclude those from
; every proxy env or all three setup()/loop()s link together ("multiple definition"). --gc-sections
; drops the unused FtmsTrainerServer/FtmsErgClient seam code, so no need to filter the classes too.
build_src_filter = +<*> -<ftms_server_main.cpp> -<ftms_client_main.cpp>
monitor_speed = 115200
monitor_dtr = 0                  ; C3 native USB: don't toggle DTR/RTS (avoids reset race)
monitor_rts = 0
lib_deps = h2zero/NimBLE-Arduino@^2.2.0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1           ; default: synthesise power (bench-test with no real meter)
    -DUSE_WIFI=0                 ; default: no WiFi (so no wifi_secret.h needed to build)

; ======================================================================================
; WaveShare ESP32-S3-Touch-LCD-1.47 — the "advanced" head-unit board (findings:
; advanced-board-s3-touch.md). ESP32-S3R8: dual-core LX7, 8 MB OPI PSRAM, 16 MB flash,
; native USB (COM16 on the dev machine), 1.47" 172x320 JD9853 LCD (SPI2: MOSI=39 SCLK=38
; CS=21 DC=45 RST=40 BL=46) + AXS5106 capacitive touch (I2C: SDA=42 SCL=41, RST=48 INT=47).
; The bike-computer build: meter central + crank peripheral + FTMS erg client + WiFi + LCD UI.
; First flash over USB: python code/scripts/flash_c3.py --env esp32s3-touch --port COM16
; ======================================================================================
; S3 BRING-UP DIAGNOSTIC env: the base proxy on the S3 with NO LCD, WiFi ON (for the NVS bootstage
; breadcrumb) and -DS3_DIAG (guaranteed serial burst + per-stage prints + NVS bootStage). Used to
; localise the pre-setup() hang that blocks the S3 (findings/advanced-board-s3-touch.md). The board's
; USB serial is flaky, so the reliable signal is: flash this, then dump NVS 'sb20perf/bootstage' with
; readboot.py — it shows how far setup() got. NEXT: solder a UART on GPIO43(TX) for the panic
; backtrace, or try the pioarduino (IDF 5.x) platform.
[env:esp32s3-min]
extends = env:esp32c3-supermini
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1
    -DUSE_LCD=0
    -DS3_DIAG=1

; ⚠️ ON-HARDWARE BRING-UP INCOMPLETE (2026-07-02): compiles + flashes clean, but the image hangs
; BEFORE setup() on this board (no BLE advert / serial / NVS) — reproduced on the minimal base proxy
; too (esp32s3-min), so it's a board/Arduino-core issue, not the UI. The full head-unit UI is pure +
; host-tested + screenshot-verified (lib/proxy/LcdUi.h, test_lcd_*). See findings/advanced-board-s3-touch.md.
[env:esp32s3-touch]
extends = env:esp32c3-supermini
board = esp32-s3-devkitc-1
monitor_dtr = 1              ; S3 TinyUSB CDC only flows when the host asserts DTR (C3 base sets 0)
monitor_rts = 0
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; two 6.25MB OTA app slots + spiffs
; NOTE: no PSRAM. The board has 8 MB octal PSRAM, but enabling it (BOARD_HAS_PSRAM) routes large
; allocations there — and PSRAM isn't mapped during C++ static init, so the 172x320 framebuffer's
; global ctor aborted the boot (empty NVS, no BLE advert; diagnosed 2026-07-02). We don't need it:
; the ~110 KB framebuffer + heap fit the 512 KB internal SRAM. Re-add only with a lazy PSRAM path.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1           ; bench default: synthesised power, no real meter needed
    -DUSE_WIFI=1
    -DUSE_LCD=1                  ; the 172x320 touch UI (disp/LcdDisplay + lib/proxy LcdUi)

; Live: the real BLE central reads an actual meter (ride build).
[env:esp32s3-touch-live]
extends = env:esp32s3-touch
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1
    -DUSE_LCD=1

; Bench: live central that accepts ANY CPS advertiser (the WinRT fake_meter rig). DESK ONLY.
[env:esp32s3-touch-live-bench]
extends = env:esp32s3-touch-live
build_flags =
    ${env:esp32s3-touch-live.build_flags}
    -DMETER_MATCH_ANY_CPS=1

; OTA variants (after the first USB flash): pio run -e esp32s3-touch-ota -t upload --upload-port <ip>
[env:esp32s3-touch-ota]
extends = env:esp32s3-touch
upload_protocol = espota

[env:esp32s3-touch-live-ota]
extends = env:esp32s3-touch-live
upload_protocol = espota

; ---- WiFi build: captive-portal setup + HTTP observability (USB-flashed) ----
; WiFi creds are provisioned at runtime via a captive portal (no wifi_secret.h required) and
; stored in NVS. The FIRST flash is over USB with this serial env:
;   pio run -e esp32c3-wifi -t upload
; On boot the device raises the open AP 'SB20-Setup' and serves a setup page at
; http://192.168.4.1/ — join it, pick your network, and it reboots onto WiFi.
; (firmware/wifi_secret.h is OPTIONAL: if present it only seeds the very first boot.)
[env:esp32c3-wifi]
extends = env:esp32c3-supermini
board_build.partitions = min_spiffs.csv   ; two OTA app slots (WiFi+BLE binary is large)
upload_speed = 115200   ; C3 native USB-JTAG drops the stub at the 460800 default ("No serial data received")
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1

; ---- Same WiFi build, flashed over-the-air (after the first USB flash) ----
; Identical binary to esp32c3-wifi; only the upload transport differs (espota, not serial):
;   pio run -e esp32c3-ota -t upload --upload-port <device-ip>
; GET http://<device-ip>/ -> dashboard; /status -> JSON; /setup -> source/identity; /forget -> re-setup.
; NOTE: espota push OTA is authenticated and OFF unless firmware/ota_secret.h defines OTA_PASSWORD
; (fail-closed; 2026-06-24 security review). Without it, flash over USB; networked updates use the
; signed-pull path (code/findings/ota-update-plan.md). There is no browser /update form anymore.
[env:esp32c3-ota]
extends = env:esp32c3-wifi
upload_protocol = espota

; ---- WiFi build + 0.42" OLED (peff74 ESP32-C3 OLED board: SSD1306 72x40, SDA=5/SCL=6) ----
; Adds the U8g2 driver + the on-screen status display (portal info, then the IP + live watts).
; First flash over USB with this env (a fresh board sets our partition table); thereafter flash
; over the air with esp32c3-oled-ota below.
;   pio run -e esp32c3-oled -t upload                          # first time, over USB
[env:esp32c3-oled]
extends = env:esp32c3-wifi
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.0
    olikraus/U8g2@^2.35.30
build_flags =
    ${env:esp32c3-wifi.build_flags}
    -DUSE_OLED=1

; ---- Same OLED build, flashed over-the-air ----
;   pio run -e esp32c3-oled-ota -t upload --upload-port <device-ip>
[env:esp32c3-oled-ota]
extends = env:esp32c3-oled
upload_protocol = espota

; ======================================================================================
; LIVE builds: the REAL dual-role proxy (USE_MOCK_METER=0). The BLE central (BleMeterClient)
; actually scans for + reads a power meter, instead of synthesising a ramp. This is the build
; that exercises goal #1 (receive from a real meter / the Python winrt fake_meter) AND goal #2
; (broadcast the relayed power to a central / the Python crank_reader) at the same time.
; Flash over USB first (fresh board), then iterate over the air with the *-ota variant.
;   python -m platformio run -e esp32c3-oled-live -t upload            # OLED board, over USB
;   python -m platformio run -e esp32c3-wifi-live -t upload            # plain board, over USB
; ======================================================================================
[env:esp32c3-wifi-live]
extends = env:esp32c3-wifi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1

[env:esp32c3-wifi-live-ota]
extends = env:esp32c3-wifi-live
upload_protocol = espota

[env:esp32c3-oled-live]
extends = env:esp32c3-oled
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1
    -DUSE_OLED=1

[env:esp32c3-oled-live-ota]
extends = env:esp32c3-oled-live
upload_protocol = espota

; ======================================================================================
; BENCH builds: a *-live build that also sets -DMETER_MATCH_ANY_CPS=1, so the BLE central
; reads ANY CPS-advertising device that isn't our spoof and isn't a "Stages " crank. This is
; how the desk rig (Python scripts/fake_meter.py over WinRT) is matched: Windows stamps the PC's
; name into the scan response (not "ASSIOMA"), defeating the production name filter, while still
; advertising CPS 0x1818 in the primary advert (decisions.md 2026-06-22). DESK ONLY — do NOT ride
; with a bench build: it would also latch onto a stranger's CPS meter.
;   python code/scripts/flash_c3.py --env esp32c3-wifi-live-bench --port COM10   # spare board
; ======================================================================================
[env:esp32c3-wifi-live-bench]
extends = env:esp32c3-wifi-live
build_flags =
    ${env:esp32c3-wifi-live.build_flags}
    -DMETER_MATCH_ANY_CPS=1

[env:esp32c3-wifi-live-bench-ota]
extends = env:esp32c3-wifi-live-bench
upload_protocol = espota

; CORRECTOR demo bench: the bench build (reads any CPS rig) PLUS -DCORRECTOR_DEMO=1, which seeds a
; CORRECTOR config at boot — own identity "SB20 Corrector" (no Stages service) + a flat 1.10× curve.
; So fake_meter 200 W -> this board -> rebroadcast 220 W under our own name, readable by any head unit.
; Validates the corrector identity + run-mode correction before the calibration wizard (M4) exists.
; DESK ONLY.  python code/scripts/flash_c3.py --env esp32c3-wifi-corrector-bench --port COM10
[env:esp32c3-wifi-corrector-bench]
extends = env:esp32c3-wifi-live-bench
build_flags =
    ${env:esp32c3-wifi-live-bench.build_flags}
    -DCORRECTOR_DEMO=1

; ======================================================================================
; FTMS test builds (flag-gated seams, F5). Self-contained: each compiles ONE dedicated main
; + its FTMS seam (build_src_filter excludes the proxy main + ble/Ble* + net/disp), so they
; pull in only NimBLE + the pure Ftms.h codec — no WiFi/OLED. Bench-tested via the F6 loop:
;   python -m platformio run -e esp32c3-ftms-server                  # compile
;   python code/scripts/flash_c3.py --env esp32c3-ftms-server --port COM10
; The two boards (or one board + the host as the peer) then talk FTMS to each other.
; ======================================================================================
[env:esp32c3-ftms-server]
extends = env:esp32c3-supermini
build_src_filter = -<*> +<ftms_server_main.cpp> +<ble/FtmsTrainerServer.cpp>

[env:esp32c3-ftms-ergclient]
extends = env:esp32c3-supermini
build_src_filter = -<*> +<ftms_client_main.cpp> +<ble/FtmsErgClient.cpp>
