; sb20proxy ESP32 firmware — a dual-role BLE proxy:
;   real power meter (BLE central) -> [correction] -> spoofed Stages crank (BLE peripheral) -> SB20
;
; Layout mirrors cauldnz/raedian-probe's firmware: the platform-agnostic core lives in
; lib/proxy/ and is host-unit-tested (no hardware); src/main.cpp + src/ble are the only
; Arduino/NimBLE files.
;
;   pio test -e native                       # host tests of the pure core (codec/correction/relay)
;   pio run  -e esp32c3-supermini -t upload  # real firmware on an ESP32-C3 Super Mini
;
; The owner's "ESP32 Super Mini" is an ESP32-C3; the WaveShare touch board is an ESP32-S3.

[platformio]
default_envs = esp32c3-supermini

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
; Stamp the git SHA + build time into every build (-DSB20_BUILD_SHA / -DSB20_BUILD_TIME) so
; /status, /diag and the screen report exactly which build is installed. See scripts/build_version.py.
extra_scripts = pre:scripts/build_version.py

; ---- Host unit tests: the pure proxy core, no hardware ----
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>          ; src/ needs Arduino/NimBLE; the test provides main() on host
test_ignore = test_lvglui        ; the LVGL UI suite is its own env below (needs lvgl + the shim)

; ---- Host LVGL UI tests: render the REAL src/ui/LvglUi.cpp headless (findings/ui-unification.md §U5) ----
; Compiles the LVGL head-unit UI on the host against a tiny Arduino shim (test/lvgl_shim) + a
; memory-buffer flush hook, so the code that ships on the CYD + S3 ride boards gets desk-test
; coverage (pixels + tap->UiAction) with no board and no SDL/X11. lvgl renders fully in-memory.
;   pio test -e native-lvgl
[env:native-lvgl]
platform = native
test_framework = unity
test_ignore = test_proxy         ; this env runs ONLY the LVGL UI suite
test_build_src = yes             ; pio test skips src/ by default; we DO need src/ui/LvglUi.cpp compiled
lib_deps = lvgl/lvgl@^9.3.0       ; same major as the device envs (resolves 9.5.x) so pixels match
build_src_filter = -<*> +<ui/LvglUi.cpp> +<ui/fonts/>   ; the UI + its baked Inter fonts only
build_flags =
    ${env.build_flags}
    -DUSE_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -DLCD_PANEL_W=240            ; CYD geometry (any LVGL board's layout works the same on host)
    -DLCD_PANEL_H=320
    -Iinclude                    ; lv_conf.h (must match the device build's ABI)
    -Itest/lvgl_shim             ; the host <Arduino.h> shim
    -Isrc/ui                     ; LvglUi.h / LcdTheme.h (src subdir isn't auto on the test path)
    -Ilib/proxy                  ; LcdUi.h + the shared view-model / action headers

; ---- Real firmware: ESP32-C3 Super Mini ----
[env:esp32c3-supermini]
platform = espressif32@~6.7.0
board = esp32-c3-devkitm-1       ; the Super Mini is pin/flash compatible
framework = arduino
test_framework = unity
; The proxy mains are main.cpp; the FTMS test builds bring their OWN setup()/loop() in
; ftms_{server,client}_main.cpp (each with its own build_src_filter below). Exclude those from
; every proxy env or all three setup()/loop()s link together ("multiple definition"). --gc-sections
; drops the unused FtmsTrainerServer/FtmsErgClient seam code, so no need to filter the classes too.
build_src_filter = +<*> -<ftms_server_main.cpp> -<ftms_client_main.cpp> -<cyd_probe_main.cpp> -<ui/>
monitor_speed = 115200
monitor_dtr = 0                  ; C3 native USB: don't toggle DTR/RTS (avoids reset race)
monitor_rts = 0
lib_deps = h2zero/NimBLE-Arduino@^2.2.0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1           ; default: synthesise power (bench-test with no real meter)
    -DUSE_WIFI=0                 ; default: no WiFi (so no wifi_secret.h needed to build)

; ======================================================================================
; WaveShare ESP32-S3-Touch-LCD-1.47 — the "advanced" head-unit board (findings:
; advanced-board-s3-touch.md). ESP32-S3R8: dual-core LX7, 8 MB OPI PSRAM, 16 MB flash,
; native USB (COM16 on the dev machine), 1.47" 172x320 JD9853 LCD (SPI2: MOSI=39 SCLK=38
; CS=21 DC=45 RST=40 BL=46) + AXS5106 capacitive touch (I2C: SDA=42 SCL=41, RST=48 INT=47).
; The bike-computer build: meter central + crank peripheral + FTMS erg client + WiFi + LCD UI.
; First flash over USB: python code/scripts/flash_c3.py --env esp32s3-touch --port COM16
; ======================================================================================
; S3 BRING-UP DIAGNOSTIC env: the base proxy on the S3 with NO LCD, WiFi ON (for the NVS bootstage
; breadcrumb) and -DS3_DIAG (guaranteed serial burst + per-stage prints + NVS bootStage). Used to
; localise the pre-setup() hang that blocks the S3 (findings/advanced-board-s3-touch.md). The board's
; USB serial is flaky, so the reliable signal is: flash this, then dump NVS 'sb20perf/bootstage' with
; readboot.py — it shows how far setup() got. NEXT: solder a UART on GPIO43(TX) for the panic
; backtrace, or try the pioarduino (IDF 5.x) platform.
[env:esp32s3-min]
extends = env:esp32c3-supermini
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1
    -DUSE_LCD=0
    -DS3_DIAG=1

; ── pioarduino platform (Arduino 3.x / IDF 5.5) — the S3 boot unblock ──────────────────
; The stock espressif32@6.7.0 core (Arduino 2.0.17 / IDF 4.4) boot-loops in the 2nd-stage
; bootloader on this exact module (crashes before its banner, any flash-mode/freq — boot log
; 2026-07-02). Root cause: the IDF-4.4 bootloader is too old for this S3 module. pioarduino
; ships the modern IDF-5.5 bootloader with current S3 support. esp32s3-pio-min = the same
; minimal DIAG probe as esp32s3-min but on the new platform: first prove it boots past the
; bootloader, then esp32s3-pio (full LCD UI) below.
[env:esp32s3-pio-min]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
; This S3-Touch module reports 8 MB flash (ROM: "flash chip size 0x800000") — the 16MB partition
; table boot-loops it ("partition … exceeds flash chip size", 2026-07-11). See BOARDS.md (MAC
; A4:CB:8F:DA:E9:CC). If a 16 MB S3 shows up, split this into an 8MB vs 16MB variant.
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
; Arduino 3.x split WiFi's deps into the Network/Networking libs. The global deep+ LDF mode
; evaluates preprocessor conditionals, which mis-resolves the network refactor's includes
; (fatal "Network.h: No such file"; espressif/arduino-esp32#9782). Plain `deep` (no `+`) skips
; that evaluation and compiles — while still recursing our header-only lib/proxy includes.
; Plain `deep` (unlike deep+) won't auto-discover the flat-layout, manifest-less lib/monocypher
; that OtaVerify.h needs, so force it into the build explicitly (compiles its .c + adds its -I).
lib_ldf_mode = deep
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.0
    symlink://lib/monocypher
    lvgl/lvgl@^9.3.0
build_src_filter = +<*> -<ftms_server_main.cpp> -<ftms_client_main.cpp> -<cyd_probe_main.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1
    -DUSE_LCD=0
    -DS3_DIAG=1

; Full head-unit UI on the pioarduino platform (the S3 ride build). Same flags as esp32s3-touch
; but on Arduino 3.x/IDF 5.5 (LcdDisplay's LEDC backlight is version-guarded for 3.x). Once
; esp32s3-pio-min proves the board boots past the bootloader, this is the build to ride.
; PSRAM (dio_opi = keep the DIO flash that boots + enable the S3R8 octal PSRAM): the 172x320x2
; = 110 KB framebuffer (LcdCanvas std::vector) can't get a contiguous block in internal DRAM once
; WiFi+BLE are up (std::bad_alloc -> abort, boot log 2026-07-02). With PSRAM enabled, large mallocs
; land there. Kept off esp32s3-pio-min (no LCD, no big buffer).
[env:esp32s3-pio]
extends = env:esp32s3-pio-min
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1
    -DUSE_LCD=1
    -DUSE_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -Iinclude

; Live: real BLE central reads an actual meter (the S3 ride build).
[env:esp32s3-pio-live]
extends = env:esp32s3-pio
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1
    -DUSE_LCD=1
    -DUSE_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -Iinclude                    ; lv_conf.h must be visible to the lvgl LIB build too (ABI!)

; Bench: live central that accepts ANY CPS advertiser (the WinRT fake_meter rig). DESK ONLY.
[env:esp32s3-pio-live-bench]
extends = env:esp32s3-pio-live
build_flags =
    ${env:esp32s3-pio-live.build_flags}
    -DMETER_MATCH_ANY_CPS=1

; OTA variants (after the first USB flash).
[env:esp32s3-pio-ota]
extends = env:esp32s3-pio
upload_protocol = espota

[env:esp32s3-pio-live-ota]
extends = env:esp32s3-pio-live
upload_protocol = espota

; ⛔ SUPERSEDED — DO NOT USE for the S3 head-unit. This env is on the stock espressif32@6.7.0
; (Arduino 2.0.x / IDF 4.4) core, whose 2nd-stage bootloader CRASH-LOOPS on this exact module (the image
; never reaches the app). Use the pioarduino envs above instead: **esp32s3-pio** (full LCD UI, boots +
; renders + touch, 2026-07-03) / esp32s3-pio-min (DIAG). Kept only as the record of the old path.
; See findings/advanced-board-s3-touch.md §"Bring-up RESOLVED".
[env:esp32s3-touch]
extends = env:esp32c3-supermini
board = esp32-s3-devkitc-1
monitor_dtr = 1              ; S3 TinyUSB CDC only flows when the host asserts DTR (C3 base sets 0)
monitor_rts = 0
board_build.flash_size = 16MB
; This flash wants QIO: earlier DIO builds boot-looped in the 2nd-stage bootloader (rst:0x3 right
; after "entry", `mode:DIO`, never reached the app — boot log 2026-07-02). The bootloader binary is
; selected by flash_mode, so we force plain `qio` (→ bootloader_qio_80m, which the Arduino framework
; ships). No PSRAM/memory_type — it's not needed (the 172x320 framebuffer is allocated lazily in
; internal SRAM, main.cpp g_lcdFrame()) and qio_opi/opi confused the bootloader selection.
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv   ; two 6.25MB OTA app slots + spiffs
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1           ; bench default: synthesised power, no real meter needed
    -DUSE_WIFI=1
    -DUSE_LCD=1                  ; the 172x320 touch UI (disp/LcdDisplay + lib/proxy LcdUi)

; Live: the real BLE central reads an actual meter (ride build).
[env:esp32s3-touch-live]
extends = env:esp32s3-touch
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1
    -DUSE_LCD=1

; Bench: live central that accepts ANY CPS advertiser (the WinRT fake_meter rig). DESK ONLY.
[env:esp32s3-touch-live-bench]
extends = env:esp32s3-touch-live
build_flags =
    ${env:esp32s3-touch-live.build_flags}
    -DMETER_MATCH_ANY_CPS=1

; OTA variants (after the first USB flash): pio run -e esp32s3-touch-ota -t upload --upload-port <ip>
[env:esp32s3-touch-ota]
extends = env:esp32s3-touch
upload_protocol = espota

[env:esp32s3-touch-live-ota]
extends = env:esp32s3-touch-live
upload_protocol = espota

; ---- WiFi build: captive-portal setup + HTTP observability (USB-flashed) ----
; WiFi creds are provisioned at runtime via a captive portal (no wifi_secret.h required) and
; stored in NVS. The FIRST flash is over USB with this serial env:
;   pio run -e esp32c3-wifi -t upload
; On boot the device raises the open AP 'SB20-Setup' and serves a setup page at
; http://192.168.4.1/ — join it, pick your network, and it reboots onto WiFi.
; (firmware/wifi_secret.h is OPTIONAL: if present it only seeds the very first boot.)
[env:esp32c3-wifi]
extends = env:esp32c3-supermini
board_build.partitions = min_spiffs.csv   ; two OTA app slots (WiFi+BLE binary is large)
upload_speed = 115200   ; C3 native USB-JTAG drops the stub at the 460800 default ("No serial data received")
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1

; ---- Same WiFi build, flashed over-the-air (after the first USB flash) ----
; Identical binary to esp32c3-wifi; only the upload transport differs (espota, not serial):
;   pio run -e esp32c3-ota -t upload --upload-port <device-ip>
; GET http://<device-ip>/ -> dashboard; /status -> JSON; /setup -> source/identity; /forget -> re-setup.
; NOTE: espota push OTA is authenticated and OFF unless firmware/ota_secret.h defines OTA_PASSWORD
; (fail-closed; 2026-06-24 security review). Without it, flash over USB; networked updates use the
; signed-pull path (code/findings/ota-update-plan.md). There is no browser /update form anymore.
[env:esp32c3-ota]
extends = env:esp32c3-wifi
upload_protocol = espota

; ---- WiFi build + 0.42" OLED (peff74 ESP32-C3 OLED board: SSD1306 72x40, SDA=5/SCL=6) ----
; Adds the U8g2 driver + the on-screen status display (portal info, then the IP + live watts).
; First flash over USB with this env (a fresh board sets our partition table); thereafter flash
; over the air with esp32c3-oled-ota below.
;   pio run -e esp32c3-oled -t upload                          # first time, over USB
[env:esp32c3-oled]
extends = env:esp32c3-wifi
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.0
    olikraus/U8g2@^2.35.30
build_flags =
    ${env:esp32c3-wifi.build_flags}
    -DUSE_OLED=1

; ---- Same OLED build, flashed over-the-air ----
;   pio run -e esp32c3-oled-ota -t upload --upload-port <device-ip>
[env:esp32c3-oled-ota]
extends = env:esp32c3-oled
upload_protocol = espota

; ======================================================================================
; LIVE builds: the REAL dual-role proxy (USE_MOCK_METER=0). The BLE central (BleMeterClient)
; actually scans for + reads a power meter, instead of synthesising a ramp. This is the build
; that exercises goal #1 (receive from a real meter / the Python winrt fake_meter) AND goal #2
; (broadcast the relayed power to a central / the Python crank_reader) at the same time.
; Flash over USB first (fresh board), then iterate over the air with the *-ota variant.
;   python -m platformio run -e esp32c3-oled-live -t upload            # OLED board, over USB
;   python -m platformio run -e esp32c3-wifi-live -t upload            # plain board, over USB
; ======================================================================================
[env:esp32c3-wifi-live]
extends = env:esp32c3-wifi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1

[env:esp32c3-wifi-live-ota]
extends = env:esp32c3-wifi-live
upload_protocol = espota

[env:esp32c3-oled-live]
extends = env:esp32c3-oled
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1
    -DUSE_OLED=1

[env:esp32c3-oled-live-ota]
extends = env:esp32c3-oled-live
upload_protocol = espota

; ---- 0.96" 128x64 OLED variant (AliExpress ESP32-C3 + 0.96" SSD1306, MAC 10:B4:1D:BA:C9:0C) ----
; Same live proxy as esp32c3-oled-live but the bigger panel (bigger fonts, more rows). I2C pins
; default SCL=6 / SDA=5 (both C3 OLED boards seen so far — confirm a new board with `pio run -e
; c3-oled-probe`); override with -DOLED_SCL_PIN= / -DOLED_SDA_PIN= if it differs. See BOARDS.md.
;   python code/scripts/flash_c3.py --env esp32c3-oled96-live --port COMxx   (first USB flash)
[env:esp32c3-oled96-live]
extends = env:esp32c3-oled-live
build_flags =
    ${env:esp32c3-oled-live.build_flags}
    -DOLED_128X64=1

[env:esp32c3-oled96-live-ota]
extends = env:esp32c3-oled96-live
upload_protocol = espota

; SH1106-controller variant of the 0.96" board. Many AliExpress 0.96" panels use an SH1106 (132-col
; RAM, +2px offset) rather than an SSD1306 — indistinguishable over I2C (both ACK 0x3C), so it's a
; needs-eyes fact. The c3-oled-probe env sweeps both controllers on the confirmed pins to reveal which.
; Use this env if the SSD1306 build (esp32c3-oled96-live) draws blank/garbled on a confirmed-pin panel.
[env:esp32c3-oled96sh-live]
extends = env:esp32c3-oled96-live
build_flags =
    ${env:esp32c3-oled96-live.build_flags}
    -DOLED_SH1106=1

[env:esp32c3-oled96sh-live-ota]
extends = env:esp32c3-oled96sh-live
upload_protocol = espota

; ======================================================================================
; BENCH builds: a *-live build that also sets -DMETER_MATCH_ANY_CPS=1, so the BLE central
; reads ANY CPS-advertising device that isn't our spoof and isn't a "Stages " crank. This is
; how the desk rig (Python scripts/fake_meter.py over WinRT) is matched: Windows stamps the PC's
; name into the scan response (not "ASSIOMA"), defeating the production name filter, while still
; advertising CPS 0x1818 in the primary advert (decisions.md 2026-06-22). DESK ONLY — do NOT ride
; with a bench build: it would also latch onto a stranger's CPS meter.
;   python code/scripts/flash_c3.py --env esp32c3-wifi-live-bench --port COM10   # spare board
; ======================================================================================
[env:esp32c3-wifi-live-bench]
extends = env:esp32c3-wifi-live
build_flags =
    ${env:esp32c3-wifi-live.build_flags}
    -DMETER_MATCH_ANY_CPS=1

[env:esp32c3-wifi-live-bench-ota]
extends = env:esp32c3-wifi-live-bench
upload_protocol = espota

; CORRECTOR demo bench: the bench build (reads any CPS rig) PLUS -DCORRECTOR_DEMO=1, which seeds a
; CORRECTOR config at boot — own identity "SB20 Corrector" (no Stages service) + a flat 1.10-- curve.
; So fake_meter 200 W -> this board -> rebroadcast 220 W under our own name, readable by any head unit.
; Validates the corrector identity + run-mode correction before the calibration wizard (M4) exists.
; DESK ONLY.  python code/scripts/flash_c3.py --env esp32c3-wifi-corrector-bench --port COM10
[env:esp32c3-wifi-corrector-bench]
extends = env:esp32c3-wifi-live-bench
build_flags =
    ${env:esp32c3-wifi-live-bench.build_flags}
    -DCORRECTOR_DEMO=1

; ======================================================================================
; FTMS test builds (flag-gated seams, F5). Self-contained: each compiles ONE dedicated main
; + its FTMS seam (build_src_filter excludes the proxy main + ble/Ble* + net/disp), so they
; pull in only NimBLE + the pure Ftms.h codec — no WiFi/OLED. Bench-tested via the F6 loop:
;   python -m platformio run -e esp32c3-ftms-server                  # compile
;   python code/scripts/flash_c3.py --env esp32c3-ftms-server --port COM10
; The two boards (or one board + the host as the peer) then talk FTMS to each other.
; ======================================================================================
[env:esp32c3-ftms-server]
extends = env:esp32c3-supermini
build_src_filter = -<*> +<ftms_server_main.cpp> +<ble/FtmsTrainerServer.cpp>

[env:esp32c3-ftms-ergclient]
extends = env:esp32c3-supermini
build_src_filter = -<*> +<ftms_client_main.cpp> +<ble/FtmsErgClient.cpp>

; ======================================================================================
; AliExpress ESP32-2432S028R "Cheap Yellow Display" (CYD) — classic ESP32-WROOM-32
; (ESP32-D0WD-V3, 4MB flash, NO PSRAM), 2.8" 240x320 TFT (ILI9341/ST7789 - the 2-USB
; variant differs per batch), XPT2046 resistive touch, CH340 UART on COM17.
; Classic ESP32 = UART serial (no native-USB CDC): do NOT set ARDUINO_USB_* flags here.
; No PSRAM -> the 240x320x2 framebuffer (153KB) can't sit in one block beside WiFi+BLE,
; so the UI renders in LCD_BANDS horizontal slices (38KB each at 4 bands).
; ======================================================================================
; Hardware probe (own main): panel ID via register reads, color bars, raw touch dump.
;   pio run -e cyd-probe -t upload --upload-port COM17
[env:cyd-probe]
platform = espressif32@~6.7.0
board = esp32dev
framework = arduino
build_src_filter = -<*> +<cyd_probe_main.cpp>
monitor_speed = 115200
upload_speed = 460800

; C3 0.96" OLED I2C pin probe (own main, guarded by -DC3_OLED_PROBE so it's inert in every other
; env). Sweeps common SDA/SCL pairs + full I2C scan to find where the SSD1306/SH1106 is wired.
;   python code/scripts/flash_c3.py --env c3-oled-probe --port COMxx   (native-USB C3: needs esptool >= 4.11)
[env:c3-oled-probe]
extends = env:esp32c3-supermini
build_src_filter = -<*> +<c3_oled_probe_main.cpp>
lib_deps = olikraus/U8g2@^2.35.30   ; the probe self-reports the found pins ON the OLED
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -DC3_OLED_PROBE

; Full bike computer on the CYD (mock meter bench build).
[env:esp32cyd]
platform = espressif32@~6.7.0
board = esp32dev
framework = arduino
test_framework = unity
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<ftms_server_main.cpp> -<ftms_client_main.cpp> -<cyd_probe_main.cpp>
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.0
    lvgl/lvgl@^9.3.0
build_flags =
    ${env.build_flags}
    -DUSE_MOCK_METER=1
    -DUSE_WIFI=1
    -DUSE_LCD=1
    -DUSE_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -Iinclude                    ; lv_conf.h must be visible to the lvgl LIB build too (ABI!)
    -DLCD_DRIVER_CYD=1
    -DLCD_PANEL_W=240
    -DLCD_BANDS=4
    -DSB20_STATUS_LED_PIN=4      ; CYD RGB-red (GPIO8 = classic-ESP32 FLASH pin - never drive it)

; Live: real BLE central reads an actual meter.
[env:esp32cyd-live]
extends = env:esp32cyd
build_flags =
    ${env.build_flags}
    -DUSE_MOCK_METER=0
    -DUSE_WIFI=1
    -DUSE_LCD=1
    -DUSE_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -Iinclude                    ; lv_conf.h must be visible to the lvgl LIB build too (ABI!)
    -DLCD_DRIVER_CYD=1
    -DLCD_PANEL_W=240
    -DLCD_BANDS=4
    -DSB20_STATUS_LED_PIN=4

; Bench: live central that accepts ANY CPS advertiser (the WinRT fake_meter rig). DESK ONLY.
[env:esp32cyd-live-bench]
extends = env:esp32cyd-live
build_flags =
    ${env:esp32cyd-live.build_flags}
    -DMETER_MATCH_ANY_CPS=1
