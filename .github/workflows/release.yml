# Cut a release of the shipped firmware: the C3-OLED crank spoof and, from 0.1.1, the Guition head
# unit (`sb20proxy.release.targets_for` decides which boards a version carries).
#
# Push a `vMAJOR.MINOR.PATCH` tag and this builds `esp32c3-oled-live-release` stamped with that
# version, verifies the stamp landed in the image, and publishes it as a GitHub release with the
# matching RELEASES.md section as its notes. Runbook: beta/RELEASE-AND-OTA.md.
#
# `workflow_dispatch` is the RELEASE-CANDIDATE path: it builds and uploads the same image as a
# workflow artifact and publishes nothing, so a candidate can be flashed and ridden before a tag
# exists. There are deliberately no prerelease *tags* — the device compares versions as three
# integers, so `v0.1.0-rc1` is indistinguishable from `v0.1.0` and would strand any board that took
# it (sb20proxy.release.version_from_tag refuses them).
#
# A release is gated on the same suites as `tests.yml`, re-run here rather than trusted from the
# tagged commit's earlier run: a green check from an older base is not enough (CLAUDE.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the candidate with (e.g. 0.1.0). Publishes nothing."
        required: true
        default: "0.1.0"

permissions:
  contents: write # create the release and upload its asset

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the version-ordering check reads existing tags

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install (dev extras)
        working-directory: code
        run: pip install -e ".[dev,ota,mcp]"

      # Validation lives in tested Python (code/tests/test_release.py), not in shell: a malformed or
      # backwards version is a hazard no board reports as an error, it just never updates.
      - name: Resolve and validate the version
        id: ver
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        working-directory: code
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess
          from sb20proxy.release import GUITION_RELEASE_ENV, artifact_name, release_notes_section, is_newer_version, targets_for, version_from_tag

          if os.environ.get("INPUT_VERSION"):
              version = version_from_tag("v" + os.environ["INPUT_VERSION"].lstrip("v"))
              publish = False
          else:
              version = version_from_tag(os.environ["REF"])
              publish = True

          # Release notes are a precondition, not a courtesy: this raises if the section is missing.
          notes = release_notes_section(open("../RELEASES.md", encoding="utf-8").read(), version)

          # The pull channel only ever moves forward, so a tag that is not strictly newer than every
          # existing release would be invisible to the fleet. Fail loudly instead.
          tags = subprocess.run(["git", "tag", "--list", "v*"], capture_output=True, text=True).stdout.split()
          for other in tags:
              try:
                  previous = version_from_tag(other)
              except ValueError:
                  continue
              if previous != version and not is_newer_version(previous, version):
                  raise SystemExit(f"{version} is not newer than the existing release {previous}")

          print(f"version={version}")
          print(f"artifact={artifact_name(version)}")
          guition = any(t.env == GUITION_RELEASE_ENV for t in targets_for(version))
          print(f"guition={str(guition).lower()}")
          print(f"guition_artifact={artifact_name(version, GUITION_RELEASE_ENV)}")
          print(f"publish={str(publish).lower()}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SB20_VERSION={version}\n")
          with open("../release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(notes + "\n")
          PY

      - name: Lint
        working-directory: code
        run: ruff check src tests

      - name: Test (Python, hermetic)
        working-directory: code
        run: pytest -q

      - name: Install PlatformIO (pinned by tools/dev-env.lock)
        run: pip install "$(grep -oE '^platformio==[0-9.]+' tools/dev-env.lock)"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware-nrf/platformio.ini', '.github/workflows/tests.yml') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Test (native core)
        working-directory: firmware
        run: pio test -e native

      - name: Test (native LVGL UI harness)
        working-directory: firmware
        run: pio test -e native-lvgl

      - name: Test flash ride-guard (the release env must not need -Force)
        run: pwsh -NoProfile -File "$GITHUB_WORKSPACE/tools/tests/Test-PioIni.ps1" -RequireReal

      # SB20_VERSION comes from GITHUB_ENV above; platformio.ini reads it as ${sysenv.SB20_VERSION}.
      # If it were somehow empty the build fails on Config.h's static_assert rather than producing an
      # unstamped artifact.
      - name: Build the shipped firmware
        working-directory: firmware
        run: pio run -e esp32c3-oled-live-release

      # Belt-and-braces on the thing this whole workflow exists to get right: the version the release
      # is named for must actually be inside the image the rider flashes.
      - name: Verify the version stamp is in the image
        working-directory: firmware
        run: |
          BIN=.pio/build/esp32c3-oled-live-release/firmware.bin
          ELF=.pio/build/esp32c3-oled-live-release/firmware.elf
          ls -l "$BIN"
          if ! strings "$ELF" | grep -qxF "${SB20_VERSION}"; then
            echo "::error::'${SB20_VERSION}' is not in the built image — the stamp did not land"
            exit 1
          fi
          if strings "$ELF" | grep -qxF "0.0.0-dev"; then
            echo "::error::the built image still carries the 0.0.0-dev default"
            exit 1
          fi
          echo "stamp ${SB20_VERSION} present"

      # The merged, flash-at-offset-0 image. This is the one a visitor can actually install in one
      # step (and the only one the browser installer accepts), so the README points at it — which
      # means it has to be attached, not built by hand after the fact.
      - name: Build the browser-installable factory image
        run: |
          python code/scripts/build_factory_bin.py \
            --env esp32c3-oled-live-release \
            --version "${SB20_VERSION}" \
            --name "SB20 Proxy ${SB20_VERSION} (C3 OLED, live)"

      - name: Name the artifacts and checksum them
        run: |
          cp "firmware/.pio/build/esp32c3-oled-live-release/firmware.bin" \
             "${{ steps.ver.outputs.artifact }}"
          cp firmware/webflash/firmware-factory.bin firmware-factory.bin
          # Regenerated with the release version by the step above; the committed copy is not this.
          cp firmware/webflash/manifest.json manifest.json

      # The factory image is what most people flash, so prove the stamp is in THAT too, not just in
      # the app image the earlier step checked.
      - name: Verify the factory image carries the release version
        run: |
          if ! strings firmware-factory.bin | grep -qxF "${SB20_VERSION}"; then
            echo "::error::'${SB20_VERSION}' is not in firmware-factory.bin"
            exit 1
          fi
          grep -q "\"version\": \"${SB20_VERSION}\"" manifest.json \
            || { echo "::error::manifest.json does not name ${SB20_VERSION}"; exit 1; }
          # Size floor: the merged image is bootloader + partitions + boot_app0 + app, ~1.4 MB. A
          # much smaller file means the merge silently produced a partial image — which is the shape
          # a future esptool would fail in, since build_factory_bin.py emits the 4.x underscore flag
          # spelling (--flash_mode) that esptool 5.x renamed, and picks whichever esptool is under
          # ~/.platformio rather than pinning one.
          SIZE=$(stat -c%s firmware-factory.bin)
          echo "factory image: ${SIZE} bytes"
          if [ "${SIZE}" -lt 1000000 ]; then
            echo "::error::firmware-factory.bin is only ${SIZE} bytes — expected ~1.4 MB; the merge is incomplete"
            exit 1
          fi

      # ---- The Guition head unit, from 0.1.1 ------------------------------------------------------
      # A different platform from the C3 (pioarduino: Arduino 3.x / IDF 5.5), so it gets its own
      # PlatformIO core dir exactly as tests.yml does: sharing one lets the two platforms overwrite
      # each other's packages.
      - name: Cache PlatformIO toolchains (pioarduino, Guition)
        if: steps.ver.outputs.guition == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio-pioarduino
          key: pio-s3-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', '.github/workflows/tests.yml') }}
          restore-keys: pio-s3-${{ runner.os }}-

      - name: Build the Guition head-unit firmware
        if: steps.ver.outputs.guition == 'true'
        working-directory: firmware
        run: PLATFORMIO_CORE_DIR="$HOME/.platformio-pioarduino" pio run -e esp32-guition-live-release

      - name: Build and verify the Guition factory image
        if: steps.ver.outputs.guition == 'true'
        run: |
          python code/scripts/build_factory_bin.py \
            --env esp32-guition-live-release \
            --version "${SB20_VERSION}" \
            --name "SB20 Proxy ${SB20_VERSION} (Guition 3.5-inch head unit, live)"
          cp "firmware/.pio/build/esp32-guition-live-release/firmware.bin" \
             "${{ steps.ver.outputs.guition_artifact }}"
          cp firmware/webflash/firmware-factory-guition.bin firmware-factory-guition.bin
          cp firmware/webflash/manifest-guition.json manifest-guition.json
          if ! strings firmware-factory-guition.bin | grep -qxF "${SB20_VERSION}"; then
            echo "::error::'${SB20_VERSION}' is not in firmware-factory-guition.bin"
            exit 1
          fi
          if strings firmware-factory-guition.bin | grep -qxF "0.0.0-dev"; then
            echo "::error::the Guition image still carries the 0.0.0-dev default"
            exit 1
          fi

      - name: List and checksum everything this release publishes
        id: assets
        run: |
          ASSETS="${{ steps.ver.outputs.artifact }} firmware-factory.bin manifest.json"
          if [ "${{ steps.ver.outputs.guition }}" = "true" ]; then
            ASSETS="$ASSETS ${{ steps.ver.outputs.guition_artifact }} firmware-factory-guition.bin manifest-guition.json"
          fi
          echo "list=$ASSETS" >> "$GITHUB_OUTPUT"
          sha256sum $ASSETS | tee SHA256SUMS

      - name: Upload the release candidate (publishes nothing)
        if: steps.ver.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sb20proxy-candidate-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.ver.outputs.artifact }}
            firmware-factory.bin
            manifest.json
            ${{ steps.ver.outputs.guition_artifact }}
            firmware-factory-guition.bin
            manifest-guition.json
            SHA256SUMS
          if-no-files-found: error

      # The firmware is published, but it is NOT ride-proven by CI: the acceptance card
      # (code/scripts/qa_board.py) and the on-bike gates run on hardware afterwards, so the release
      # starts as a draft and the owner publishes it once it has passed. See beta/RELEASE-AND-OTA.md.
      - name: Publish the GitHub release (draft until the QA card passes)
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="${{ github.ref_name }} — C3-OLED crank spoof"
          if [ "${{ steps.ver.outputs.guition }}" = "true" ]; then
            TITLE="$TITLE + Guition head unit"
          fi
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "$TITLE" \
            --notes-file release-notes.md \
            ${{ steps.assets.outputs.list }} \
            SHA256SUMS
