name: tests

# Hermetic unit tests for the sb20proxy library: codec round-trips against the
# committed real captures, replay source, and ProxyCore wiring. No ANT+ stick or
# SB20 is involved — hardware behaviour is verified manually at the bench (see
# NEXT-BIKE-SESSION.md). Policy: CLAUDE.md §Validation.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install (dev extras)
        run: pip install -e ".[dev,ota,mcp]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  firmware:
    # Host-side Unity tests for the ESP32 firmware's platform-agnostic core (lib/proxy):
    # CPS codec, correction, ProxyCore relay, status JSON, and the WiFi captive-portal pure
    # logic (page render / form parse / validation). No hardware — the native env builds and
    # runs on the runner. Radio/BLE/portal glue is bench-tested (see NEXT-BIKE-SESSION.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Test (native)
        run: pio test -e native

      # Link a real proxy ESP32 env so a multiple-definition / src_filter break (e.g. the FTMS
      # mains colliding with main.cpp, fixed in PR #73) can't reach main: the native env excludes
      # src/ entirely, so it never catches a proxy-link regression. esp32c3-supermini is the
      # minimal proxy build (mock meter, no WiFi/OLED deps) and still links main.cpp + ble/*.
      - name: Compile proxy firmware (link guard)
        run: pio run -e esp32c3-supermini

      # Compile the WiFi build (USE_WIFI=1) so the net/ + OTA + web-server code (WifiLink, the
      # captive portal, /setup + /calibrate routes, the CSRF guard, and the signed-pull OTA path)
      # is actually built on CI. esp32c3-supermini is USE_WIFI=0, so without this none of that
      # code is compiled by CI — a break in it would only surface at the bench (2026-06-24).
      - name: Compile WiFi/OTA firmware (net + web + OTA code)
        run: pio run -e esp32c3-wifi

      # Host-side Unity tests for the nRF52840 Sense bridge's pure wire-format core
      # (firmware-nrf/lib/bridge: Proto.h + ImuCapture.h) — the byte-for-byte authority the Web
      # Bluetooth app and Connect IQ app mirror. The native env is board-free, so it runs here
      # (the on-board glue stays bench-verified over serial; see findings/nrf52-sense.md).
      - name: Test nRF bridge wire-format core (native)
        working-directory: firmware-nrf
        run: pio test -e native

  bridge-parity:
    # The Bridge wire contract has one source (ui-schema/bridge.json). This job proves the generated
    # mirrors are in sync (gen_bridge.py --check) and that the JS codec (web/bridge-codec.js) round-trips
    # the golden vectors (Node). The C++ side (Proto.h == golden) is locked by the firmware-nrf native
    # test above (test_golden_*). See design/ui-schema-design.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bridge mirrors in sync with the schema
        run: python code/scripts/gen_bridge.py --check

      - name: JS codec parity vs golden vectors
        run: node web/test/bridge-codec.test.mjs
